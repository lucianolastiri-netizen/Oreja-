  <!-- ================= CAPTURA ================= -->
  <section class="view capture" id="v-captura">
    <div class="vbar"><a class="back" href="#home">← Oreja</a><h2>Captura</h2><span class="vk">voz → texto</span></div>
    <div class="card">
      <textarea id="pad" placeholder="Dictá o escribí: una decisión, un criterio, una idea. Lo que hoy muere en WhatsApp."></textarea>
      <div class="crow">
        <button class="btn rec" id="rec" type="button">● Dictar nota</button>
        <button class="btn ai" id="ai" type="button">✦ Interpretar</button>
        <button class="btn" id="save" type="button">Guardar</button>
        <button class="btn" id="copy" type="button">Copiar</button>
        <button class="btn" id="clear" type="button">Limpiar</button>
        <span class="cstatus" id="cstatus">listo</span>
      </div>
      <div class="ccard" id="cap-card" hidden></div>
      <div class="saved" id="savedinfo"></div>
      <p class="hint" style="margin-top:8px">Tocá <b>Dictar</b>, permití el micrófono y hablá. Chrome (compu y Android). En iPhone usá el micrófono del teclado. <b>✦ Interpretar</b> lo convierte en un movimiento de Finanzas o un tema de Gestión para que lo confirmes. La flecha → manda una nota guardada a Gestión.</p>
      <div class="notelist" id="notelist"></div>
    </div>
  </section>
